name: Keep-Alive Ping

on:
  schedule:
    # Runs every 10 minutes to prevent Render's 15-minute inactivity spin-down
    - cron: '*/10 * * * *'
  workflow_dispatch:
    # Allows manual triggering from the GitHub Actions UI

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend Keep-Alive Endpoint
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$BACKEND_URL" ]; then
            echo "BACKEND_URL secret is not set! Please configure it in Repository Settings."
            exit 1
          fi
          
          echo "Pinging $BACKEND_URL/keep-alive..."
          
          # Send a GET request. -s for silent, -f to fail fast on HTTP errors (e.g. 500)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -f "$BACKEND_URL/keep-alive" || echo "failed")
          
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Keep-alive ping successful (Status 200)."
          else
            echo "❌ Keep-alive ping failed. Received status: $HTTP_STATUS"
            exit 1
          fi
